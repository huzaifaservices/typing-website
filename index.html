<!DOCTYPE html>
<html>
<head>
    <title>Typing Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        #text {
            font-size: 24px;
            margin: 30px auto;
            max-width: 800px;
            line-height: 1.6;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        textarea {
            width: 80%;
            max-width: 800px;
            height: 120px;
            font-size: 20px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .correct {
            color: green;
        }

        .wrong {
            color: red;
        }

        .current {
            background: #bde0ff;
        }

        #stats {
            margin: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>⌨️ Typing Practice</h1>

    <div>
        <button onclick="chooseLevel('easy')">Easy</button>
        <button onclick="chooseLevel('medium')">Medium</button>
        <button onclick="chooseLevel('hard')">Hard</button>
    </div>

    <button onclick="newTest()">🆕 New Test</button>

    <div id="text"></div>

    <textarea id="input" placeholder="Start typing here..."></textarea>

    <div id="stats">
        Time: <span id="time">60</span>s |
        WPM: <span id="wpm">0</span> |
        Accuracy: <span id="accuracy">100</span>%
    </div>

    <button onclick="restart()">🔄 Restart</button>

    <script>

        const texts = {

            easy: [
                "The sun is bright and the sky is blue.",
                "The cat is sitting on the warm mat.",
                "I like to read books and learn new things."
            ],

            medium: [
                "The quick brown fox jumps over the lazy dog.",
                "Practice typing every day to improve your speed.",
                "Good typing skills help you work faster and more accurately."
            ],

            hard: [
                "Learning to type quickly and accurately requires patience and regular practice.",
                "Concentration and consistency can help you become a faster and more confident typist.",
                "Technology makes communication easier when we can type our ideas clearly and efficiently."
            ]

        };

        let currentLevel = "easy";
        let sentence = "";
        let startTime = null;
        let timer = null;
        let timeLeft = 60;

        const textDisplay = document.getElementById("text");
        const input = document.getElementById("input");

        function chooseLevel(level) {
            currentLevel = level;
            newTest();
        }

        function newTest() {

            const list = texts[currentLevel];

            const randomNumber = Math.floor(Math.random() * list.length);

            sentence = list[randomNumber];

            restart();
        }

        function displayText() {

            textDisplay.innerHTML = "";

            for (let i = 0; i < sentence.length; i++) {

                const letter = document.createElement("span");

                letter.textContent = sentence[i];

                letter.id = "letter-" + i;

                textDisplay.appendChild(letter);
            }

            highlightCurrent(0);
        }

        function highlightCurrent(position) {

            for (let i = 0; i < sentence.length; i++) {

                const letter = document.getElementById("letter-" + i);

                if (letter) {
                    letter.classList.remove("current");
                }
            }

            if (position < sentence.length) {

                const current = document.getElementById("letter-" + position);

                if (current) {
                    current.classList.add("current");
                }
            }
        }

        input.addEventListener("input", function() {

            if (!startTime) {
                startTime = new Date();
                startTimer();
            }

            const typed = input.value;

            let correct = 0;

            for (let i = 0; i < sentence.length; i++) {

                const letter = document.getElementById("letter-" + i);

                if (!letter) continue;

                letter.classList.remove("correct");
                letter.classList.remove("wrong");

                if (i < typed.length) {

                    if (typed[i] === sentence[i]) {
                        letter.classList.add("correct");
                        correct++;
                    } else {
                        letter.classList.add("wrong");
                    }
                }
            }

            highlightCurrent(typed.length);

            updateStats(correct, typed.length);

            if (typed === sentence) {

                clearInterval(timer);

                input.disabled = true;

                alert("🎉 Great job! You finished!");
            }

        });

        function startTimer() {

            timer = setInterval(function() {

                timeLeft--;

                document.getElementById("time").textContent = timeLeft;

                if (timeLeft <= 0) {

                    clearInterval(timer);

                    input.disabled = true;

                    alert("⏰ Time is up!");

                }

            }, 1000);
        }

        function updateStats(correct, typed) {

            if (!startTime || typed === 0) return;

            const elapsed = (new Date() - startTime) / 1000 / 60;

            const wpm = Math.round((correct / 5) / elapsed);

            const accuracy = Math.round((correct / typed) * 100);

            document.getElementById("wpm").textContent = wpm;

            document.getElementById("accuracy").textContent = accuracy;
        }

        function restart() {

            clearInterval(timer);

            startTime = null;

            timeLeft = 60;

            input.value = "";

            input.disabled = false;

            document.getElementById("time").textContent = "60";

            document.getElementById("wpm").textContent = "0";

            document.getElementById("accuracy").textContent = "100";

            displayText();

            input.focus();
        }

        newTest();

    </script>

</body>
</html>
