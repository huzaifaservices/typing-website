<!DOCTYPE html>
<html>

<head>

    <title>Typing Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 900px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
        }

        .levels {
            margin: 25px;
        }

        .levels button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .easy {
            background: green;
            color: white;
        }

        .medium {
            background: orange;
            color: white;
        }

        .hard {
            background: red;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px;
            font-size: 20px;
        }

        .text {
            background: #f8fafc;
            padding: 25px;
            border-radius: 10px;
            font-size: 25px;
            line-height: 1.8;
            text-align: left;
            margin-bottom: 25px;
        }

        .correct {
            color: green;
        }

        .wrong {
            color: red;
            background: #ffe5e5;
        }

        .current {
            border-left: 3px solid blue;
        }

        textarea {
            width: 90%;
            height: 120px;
            font-size: 20px;
            padding: 15px;
            border-radius: 10px;
            resize: none;
        }

        button {
            cursor: pointer;
        }

        .restart {
            margin-top: 20px;
            padding: 12px 30px;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }

    </style>

</head>


<body>


<div class="box">


    <h1>⌨️ Typing Test</h1>


    <!-- DIFFICULTY -->

    <div class="levels">

        <button
            class="easy"
            onclick="chooseLevel('easy')">
            Easy
        </button>


        <button
            class="medium"
            onclick="chooseLevel('medium')">
            Medium
        </button>


        <button
            class="hard"
            onclick="chooseLevel('hard')">
            Hard
        </button>

    </div>



    <!-- STATS -->

    <div class="stats">

        <div>
            ⏱️
            <span id="timer">60</span>
        </div>


        <div>
            ⚡
            <span id="wpm">0</span>
            WPM
        </div>


        <div>
            🎯
            <span id="accuracy">100</span>%
        </div>

    </div>



    <!-- TEXT -->

    <div
        id="text"
        class="text">
    </div>



    <!-- INPUT -->

    <textarea
        id="typing"
        placeholder="Choose a level and start typing...">
    </textarea>


    <br>


    <button
        class="restart"
        onclick="restart()">

        Restart

    </button>


    <h2 id="result"></h2>


</div>



<script>


/* --------------------------------
   SENTENCES
-------------------------------- */


let easyText =
"The cat is on the mat. The sun is bright and the sky is blue.";


let mediumText =
"The quick brown fox jumps over the lazy dog. Practice typing every day to improve your speed.";


let hardText =
"Learning to type quickly and accurately requires patience, concentration, consistency, and regular practice.";



/* --------------------------------
   CURRENT SENTENCE
-------------------------------- */


let sentence = easyText;



/* --------------------------------
   TIMER
-------------------------------- */


let time = 60;

let timerStarted = false;

let timer;



/* --------------------------------
   ELEMENTS
-------------------------------- */


let textDisplay =
document.getElementById("text");


let typing =
document.getElementById("typing");


let timerDisplay =
document.getElementById("timer");


let wpmDisplay =
document.getElementById("wpm");


let accuracyDisplay =
document.getElementById("accuracy");


let result =
document.getElementById("result");



/* --------------------------------
   CHOOSE LEVEL
-------------------------------- */


function chooseLevel(level) {


    if (level === "easy") {

        sentence = easyText;

    }


    if (level === "medium") {

        sentence = mediumText;

    }


    if (level === "hard") {

        sentence = hardText;

    }


    restart();


}



/* --------------------------------
   SHOW TEXT
-------------------------------- */


function showSentence() {


    textDisplay.innerHTML = "";


    for (
        let i = 0;
        i < sentence.length;
        i++
    ) {


        let letter =
        document.createElement("span");


        letter.innerText =
        sentence[i];


        letter.id =
        "letter-" + i;


        textDisplay.appendChild(
        letter
        );

    }


    updateCurrentLetter();

}



/* --------------------------------
   CURRENT LETTER
-------------------------------- */


function updateCurrentLetter() {


    let letters =
    textDisplay.querySelectorAll("span");


    letters.forEach(function(letter) {

        letter.classList.remove(
        "current"
        );

    });


    let position =
    typing.value.length;


    if (letters[position]) {

        letters[position].classList.add(
        "current"
        );

    }

}



/* --------------------------------
   TYPING
-------------------------------- */


typing.addEventListener(
"input",
function() {


    if (timerStarted === false) {


        timerStarted = true;


        timer = setInterval(
        function() {


            time--;


            timerDisplay.innerText =
            time;


            calculateStats();


            if (time <= 0) {


                clearInterval(timer);


                typing.disabled =
                true;


                result.innerText =
                "⏰ Time is up!";

            }


        }, 1000);

    }


    checkLetters();

    calculateStats();

    updateCurrentLetter();

});



/* --------------------------------
   CHECK LETTERS
-------------------------------- */


function checkLetters() {


    let typed =
    typing.value;


    for (
        let i = 0;
        i < sentence.length;
        i++
    ) {


        let letter =
        document.getElementById(
        "letter-" + i
        );


        letter.classList.remove(
        "correct"
        );


        letter.classList.remove(
        "wrong"
        );


        if (i < typed.length) {


            if (
                typed[i] === sentence[i]
            ) {

                letter.classList.add(
                "correct"
                );

            } else {

                letter.classList.add(
                "wrong"
                );

            }

        }

    }

}



/* --------------------------------
   STATISTICS
-------------------------------- */


function calculateStats() {


    let typed =
    typing.value;


    let correct = 0;


    for (
        let i = 0;
        i < typed.length;
        i++
    ) {


        if (
            typed[i] === sentence[i]
        ) {

            correct++;

        }

    }


    let accuracy = 100;


    if (typed.length > 0) {


        accuracy =
        Math.round(
        (correct / typed.length) * 100
        );

    }


    accuracyDisplay.innerText =
    accuracy;



    let secondsUsed =
    60 - time;


    let wpm = 0;


    if (secondsUsed > 0) {


        wpm =
        Math.round(
        (correct / 5) /
        (secondsUsed / 60)
        );

    }


    wpmDisplay.innerText =
    wpm;

}



/* --------------------------------
   RESTART
-------------------------------- */


function restart() {


    clearInterval(timer);


    time = 60;

    timerStarted = false;


    timerDisplay.innerText =
    "60";


    wpmDisplay.innerText =
    "0";


    accuracyDisplay.innerText =
    "100";


    typing.value = "";

    typing.disabled = false;


    result.innerText = "";


    showSentence();


    typing.focus();

}



/* --------------------------------
   START
-------------------------------- */


showSentence();

typing.focus();


</script>


</body>

</html>
