<!DOCTYPE html>
<html>

<head>

    <title>Typing Test</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        textarea {
            width: 90%;
            height: 120px;
            font-size: 20px;
            padding: 15px;
        }

        .stats {
            font-size: 25px;
            margin: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
        }

    </style>

</head>


<body>


<div class="box">


    <h1>⌨️ Typing Test</h1>


    <div class="stats">

        ⏱️ Time:
        <span id="timer">60</span>

        &nbsp;&nbsp;

        ⚡ WPM:
        <span id="wpm">0</span>

        &nbsp;&nbsp;

        🎯 Accuracy:
        <span id="accuracy">100</span>%

    </div>


    <p>Type this sentence:</p>


    <h2 id="sentence">
        The quick brown fox jumps over the lazy dog.
    </h2>


    <textarea
        id="typing"
        placeholder="Start typing here...">
    </textarea>


    <br><br>


    <button onclick="restart()">
        Restart
    </button>


    <h2 id="result"></h2>


</div>



<script>


/* The sentence */

let sentence =
"The quick brown fox jumps over the lazy dog.";


/* Timer */

let time = 60;

let timerStarted = false;

let timer;



/* Get things from the page */

let typing =
document.getElementById("typing");

let timerDisplay =
document.getElementById("timer");

let wpmDisplay =
document.getElementById("wpm");

let accuracyDisplay =
document.getElementById("accuracy");

let result =
document.getElementById("result");



/* Start timer when user types */

typing.addEventListener("input", function() {


    /* Start timer */

    if (timerStarted === false) {

        timerStarted = true;


        timer = setInterval(function() {

            time = time - 1;

            timerDisplay.innerHTML = time;


            calculateStats();


            if (time === 0) {

                clearInterval(timer);

                typing.disabled = true;

                result.innerHTML =
                "⏰ Time is up!";

            }

        }, 1000);

    }


    /* Calculate WPM and accuracy */

    calculateStats();

});



/* Calculate statistics */

function calculateStats() {


    let typed =
    typing.value;


    /* Count correct letters */

    let correct = 0;


    for (
        let i = 0;
        i < typed.length;
        i++
    ) {

        if (typed[i] === sentence[i]) {

            correct++;

        }

    }


    /* Accuracy */

    let accuracy = 100;


    if (typed.length > 0) {

        accuracy =
        Math.round(
            (correct / typed.length) * 100
        );

    }


    accuracyDisplay.innerHTML =
    accuracy;



    /* WPM */

    let secondsUsed =
    60 - time;


    let wpm = 0;


    if (secondsUsed > 0) {

        wpm =
        Math.round(
            (correct / 5) /
            (secondsUsed / 60)
        );

    }


    wpmDisplay.innerHTML =
    wpm;

}



/* Restart */

function restart() {


    clearInterval(timer);


    time = 60;

    timerStarted = false;


    timerDisplay.innerHTML =
    "60";


    wpmDisplay.innerHTML =
    "0";


    accuracyDisplay.innerHTML =
    "100";


    typing.value = "";


    typing.disabled = false;


    result.innerHTML = "";


    typing.focus();

}


</script>


</body>

</html>
