<!DOCTYPE html>
<html>

<head>

    <title>Typing Test</title>

</head>


<body>

    <h1>⌨️ Typing Test</h1>

    <h2>
        Time: <span id="timer">60</span> seconds
    </h2>


    <p>Type this sentence:</p>

    <h2>
        The quick brown fox jumps over the lazy dog.
    </h2>


    <textarea
        id="typing"
        rows="5"
        cols="60"
        placeholder="Start typing here...">
    </textarea>


    <br><br>


    <button onclick="restart()">
        Restart
    </button>


    <h2 id="result"></h2>


    <script>

        let time = 60;

        let timerStarted = false;

        let timer;


        let typing =
        document.getElementById("typing");


        let timerDisplay =
        document.getElementById("timer");


        let result =
        document.getElementById("result");


        typing.addEventListener("input", function() {

            if (timerStarted === false) {

                timerStarted = true;

                timer = setInterval(function() {

                    time = time - 1;

                    timerDisplay.innerHTML = time;


                    if (time === 0) {

                        clearInterval(timer);

                        typing.disabled = true;

                        result.innerHTML =
                        "⏰ Time is up!";

                    }

                }, 1000);

            }

        });


        function restart() {

            clearInterval(timer);

            time = 60;

            timerStarted = false;

            timerDisplay.innerHTML = 60;

            typing.value = "";

            typing.disabled = false;

            result.innerHTML = "";

            typing.focus();

        }

    </script>


</body>

</html>
